controller_manager:
  ros__parameters:
    update_rate: 50 # Hz
    use_sim_time: true

    ackermann_controller:
      type: ackermann_steering_controller/AckermannSteeringController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
joint_state_broadcaster:
  ros__parameters:
    extra_joints: ["traction_right_joint", "traction_left_joint"]

ackermann_controller:
  ros__parameters:
    odom_frame_id: odom
    base_frame_id: base_link
    reference_timeout: 2.0
    front_steering: true
    open_loop: false
    velocity_rolling_window_size: 10
    position_feedback: false
    #use_stamped_vel: false
    rear_wheels_names: [right_wheel_joint, left_wheel_joint]
    front_wheels_names: [steering_right_joint, steering_left_joint]

    wheelbase: 0.3368
    front_wheel_track: 0.267
    rear_wheel_track: 0.267
    front_wheels_radius: 0.05
    rear_wheels_radius: 0.05
    cmd_vel_timeout: 2000 
    publish_ackermann_command: true 